    <text x="100" y="104" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="22" font-weight="700" letter-spacing="0.22em" fill="url(#goldGrad)" text-anchor="middle">ROXANA</text>
    <!-- Tagline -->
    <text x="100" y="124" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.16em" fill="#E2E8F0" text-anchor="middle">JOYERÍA &amp; ACCESORIOS</text>
